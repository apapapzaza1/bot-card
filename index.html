<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BOT (FANMADE) CARD</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b10;--fg:#eee;--pn:#17171f;--cb:#2b2b2e;--ce:#f2f2f2;--fs:16px;--w:62px}
[data-th=light]{--bg:#e9e6df;--fg:#1a1a1a;--pn:#fff;--cb:#ddd;--ce:#222}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs)/1.4 'Noto Sans Thai',system-ui,sans-serif;height:100dvh;overflow:hidden}
button{font:inherit;background:var(--pn);color:var(--fg);border:1px solid #888;border-radius:8px;padding:6px 10px;margin:2px}
input,textarea{font:inherit;background:var(--pn);color:var(--fg);border:1px solid #888;border-radius:8px;padding:6px;width:100%}
#bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 60%,#2a1a3a,#0b0b10 70%);overflow:hidden;z-index:-1}
[data-th=light] #bg{background:#e9e6df}
#bg i{position:absolute;width:70px;height:98px;border:2px solid #fff5;border-radius:8px;background:#fff1;animation:fl 14s linear infinite}
@keyframes fl{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}
#bg svg{position:absolute;left:50%;top:50%;width:200px;margin:-120px 0 0 -100px;opacity:.5}
.scr{height:100%;max-width:560px;margin:auto;padding:12px;overflow:auto}
#game{display:grid;height:100%;max-width:1000px;margin:auto;grid-template-rows:1fr auto auto auto}
#lg,#dt{display:none}
#ls{font-size:.75em;opacity:.85;padding:2px 8px;max-height:3.6em;overflow:hidden}
#mid{overflow:auto;padding:4px}.r{display:flex;justify-content:center;gap:4px;min-height:calc(var(--w)*1.4+6px);flex-wrap:wrap;align-items:center}
.pi{font-size:.8em;text-align:center}.pi a{text-decoration:underline;cursor:pointer}.ph{text-align:center;font-size:.8em;padding:2px;background:#fff2;border-radius:6px}
.c{width:var(--w);aspect-ratio:5/7;border:2px solid var(--ce);border-radius:7px 9px 6px 8px/9px 6px 8px 7px;background:var(--cb);color:var(--fg);font-size:calc(var(--w)/6.2);padding:8px 3px 2px;position:relative;box-shadow:1px 1px 0 1px #fff4;transition:.18s;flex:none;overflow:hidden;cursor:pointer;line-height:1.15}
[data-cs=plain] .c{border-radius:6px;box-shadow:none;border-color:#777}
.c::before{content:'';position:absolute;inset:0 0 auto;height:5px;background:var(--k,#999)}
.c b{display:block;font-size:.95em}.c i{position:absolute;top:7px;right:3px;font-style:normal;opacity:.8}.c em{position:absolute;right:3px;bottom:3px;color:#fc3}
.c .p{position:absolute;left:3px;bottom:2px;font-size:1.5em;font-weight:700;text-decoration:none}.p.up{color:#4f4}.p.dn{color:#f55}
.pop{animation:pop .9s}@keyframes pop{0%,100%{transform:scale(1)}25%{transform:scale(2.2)}50%{transform:scale(1)}75%{transform:scale(1.9)}}
.c.z{transform:rotate(90deg) scale(.82);opacity:.6;margin:0 8px}.c.bk{background:repeating-linear-gradient(45deg,#333,#333 6px,#444 6px,#444 12px)}
.c.sel{outline:3px solid #6cf}.c.pay{outline:3px solid #fc3}.c.can{outline:3px solid #f33;animation:bl 1s infinite}@keyframes bl{50%{outline-color:#f336}}
#hand{display:flex;justify-content:center;padding:28px 8px 2px;min-height:calc(var(--w)*1.4+34px);touch-action:pan-y}
#hand .c{margin-left:calc(var(--w)*-.4)}#hand .c:first-child{margin-left:0}#hand .c.h{transform:translateY(-26px) scale(1.25);z-index:5}
#bar{display:flex;flex-wrap:wrap;justify-content:center;padding:2px 4px calc(4px + env(safe-area-inset-bottom))}
#zm{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9}#zm[hidden],#md[hidden],.scr[hidden],#game[hidden]{display:none}
.big{width:min(70vw,300px);aspect-ratio:5/7;font-size:15px;background:var(--cb);border:3px solid var(--ce);border-radius:12px;padding:14px;overflow:auto;box-shadow:0 0 40px #fc38;color:var(--fg)}
#md{position:fixed;inset:0;background:#000c;z-index:8;overflow:auto;padding:14px}#md .in{background:var(--pn);border-radius:12px;padding:12px;max-width:700px;margin:auto}
[data-bg=neon] #bg{background:linear-gradient(120deg,#0ff4,#f0f4,#00f4,#0ff4);background-size:300% 300%;animation:gr 12s ease infinite}@keyframes gr{50%{background-position:100% 50%}}
[data-bg=stars] #bg{background:radial-gradient(#fff 1px,transparent 1px) 0 0/40px 40px,#05060f;animation:st 40s linear infinite}@keyframes st{to{background-position:0 400px}}
[data-bg]:not([data-bg=pasulol]) #bg i,[data-bg]:not([data-bg=pasulol]) #bg svg{display:none}#bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.ing #bg{opacity:.3}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-bottom:8px}.pk{--w:min(18vw,90px);animation:fly .9s both;box-shadow:0 0 0 1px #fff4}@keyframes fly{from{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.2);opacity:0}}
.rSR{box-shadow:0 0 16px #6cf!important}.rUR{box-shadow:0 0 18px #fc3!important}.rSCR,.rCBR,.rPR{box-shadow:0 0 22px #f6f!important}
.rw{display:flex;gap:4px;align-items:center;padding:2px 0;border-bottom:1px solid #fff2;font-size:.85em}.rw a{flex:1;text-decoration:underline;cursor:pointer}
footer{position:fixed;right:6px;bottom:2px;font-size:9px;opacity:.5;pointer-events:none}
@media(min-width:900px){:root{--w:78px}#game{grid-template-columns:260px minmax(420px,1fr) 300px;grid-template-rows:1fr auto auto}#lg,#dt{display:block;overflow:auto;padding:10px;font-size:.8em;grid-row:1/4}#lg{grid-column:1}#dt{grid-column:3}#mid{grid-column:2}#hand{grid-column:2}#bar{grid-column:2}#ls{display:none}}
</style>
<div id="bg"></div><footer>แฟนเมด ไม่เกี่ยวข้องกับ บจก. พสุโลล / ไลอ้อน เฮ้าส์ ลิขสิทธิ์การ์ดเป็นของเจ้าของเดิม</footer>
<div id="auth" class="scr"><h2 style="text-align:center">BOT (FANMADE) CARD</h2><input id="an" placeholder="ชื่อผู้ใช้ (ห้ามซ้ำ)"><br><br><input id="ap" type="password" placeholder="รหัสผ่าน"><br><button onclick="auth('login')">ล็อกอิน</button><button onclick="auth('reg')">สมัครสมาชิก</button><button onclick="st()">⚙ ตั้งค่า</button><p style="font-size:.8em;opacity:.7">สมัครใหม่รับการ์ด Starter SD01–03 ฟรี</p></div>
<div id="lobby" class="scr" hidden><div id="top"></div><input id="nm" hidden><input id="rm" placeholder="รหัสห้อง (เช่น AB12)"><br>
<button onclick="rm.value=Math.random().toString(36).slice(2,6).toUpperCase()">สร้างรหัสห้อง</button><button onclick="go()">เข้าห้อง</button><div id="lb" style="margin:8px 0"></div>
<div id="dk" hidden><div id="sv"></div><textarea id="dx" rows="5" placeholder="รายการเด็ค เช่น&#10;BT01-001 x4&#10;(รวม LIFE 5 ใบ) "></textarea>
<label><input type="checkbox" id="sk" style="width:auto"> ข้ามการตรวจเด็ค</label><br>
<button onclick="send({t:'deck',pre:'SD01'})">Starter 01</button><button onclick="send({t:'deck',pre:'SD02'})">Starter 02</button><button onclick="send({t:'deck',pre:'SD03'})">Starter 03</button><br><button onclick="send({t:'deck',text:dx.value,skip:sk.checked})">ใช้เด็คที่วาง</button><button onclick="send({t:'deck',rand:1})">เด็คสุ่มทดสอบ</button></div></div>
<div id="game" hidden><div id="lg"></div><div id="mid"></div><div id="dt"></div><div id="ls"></div><div id="hand"></div><div id="bar"></div></div>
<div id="zm" hidden></div><div id="md" hidden></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KC={แดง:'#e5484d',ฟ้า:'#3b9eff',เขียว:'#3dd68c',ม่วง:'#a78bfa'},PH={mull:'เปลี่ยนมือ',main:'Main Phase',battle:'Battle Phase',end:'End Phase',x:''};
let ws,S,ME,C={},sel=null,mode=null,atk=null,pay=[],prev={},lastEv=0,lastMine=null,lastLog=0,cfg={bg:'pasulol',bgv:'',tok:'',th:'dark',cs:'crayon',snd:1,mus:1,fs:16,wl:1};
try{Object.assign(cfg,JSON.parse(localStorage.cfg||'{}'))}catch(e){}
const vid=()=>{const o=$('bg')&&$('bg').querySelector('video');o&&o.remove();if(cfg.bgv&&$('bg'))$('bg').insertAdjacentHTML('afterbegin',`<video autoplay muted loop playsinline src="${esc(cfg.bgv)}"></video>`)};
const ap=()=>{document.documentElement.dataset.th=cfg.th;document.documentElement.dataset.cs=cfg.cs;document.documentElement.style.setProperty('--fs',cfg.fs+'px');document.body.dataset.bg=cfg.bg;vid();try{localStorage.cfg=JSON.stringify(cfg)}catch(e){}};ap();
for(let i=0;i<10;i++){const d=document.createElement('i');d.style.cssText=`left:${i*10}%;animation-delay:${-i*1.4}s;animation-duration:${12+i}s`;$('bg').append(d)}
$('bg').insertAdjacentHTML('beforeend','<svg viewBox="0 0 100 120"><path d="M50 8c-14 0-22 10-22 24 0 8 3 12 3 12-12 10-20 40-24 76h86c-4-36-12-66-24-76 0 0 3-4 3-12C72 18 64 8 50 8z" fill="#050508"/><ellipse cx="50" cy="36" rx="13" ry="16" fill="#000"/></svg>');
let AC;const note=(f,d,v,ty)=>{try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.05,d/3));g.gain.linearRampToValueAtTime(0,t+d);o.connect(g).connect(AC.destination);o.start();o.stop(t+d)}catch(e){}};
const sfx=k=>{if(cfg.snd)({turn:()=>{note(660,.3,.06);note(880,.4,.05)},hit:()=>note(120,.25,.12,'triangle'),play:()=>note(440,.15,.05)})[k]()};
let mu;const music=()=>{clearInterval(mu);if(!cfg.mus)return;const ch=[[110,277,330],[98,247,294],[87,220,262],[98,247,330]];let k=0;const f=()=>ch[k++%4].forEach(x=>note(x,5,.02));f();mu=setInterval(f,4000)};
let wl;const wake=async()=>{try{if(cfg.wl&&navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}};
const info=x=>x.tk?{n:x.tk.n,t:'Avatar',p:x.tk.p,e:'Token'}:C[x.id]||{n:'?',t:'',e:''};
let ST={};fetch('/starters.json').then(r=>r.json()).then(a=>ST=a);fetch('/cards.json').then(r=>r.json()).then(a=>a.forEach(c=>C[c.id]=c));
function conn(){ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
ws.onopen=()=>cfg.tok&&send({t:'tok',tok:cfg.tok});ws.onclose=()=>setTimeout(conn,2000);
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.err)return alert(m.err);
if(m.t=='auth'){cfg.tok=m.tok;ap();me(m.me);$('auth').hidden=true;$('lobby').hidden=false;nm.value=m.me.name}
if(m.t=='me')me(m.me);if(m.note)alert(m.note);if(m.t=='packs'){me(m.me);packs(m.ps)}
if(m.t=='lobby'){$('dk').hidden=false;$('lb').textContent='ห้อง '+rm.value.toUpperCase()+': '+m.players.map(p=>p.name+(p.ready?' ✓':'')).join(' vs ')}
if(m.t=='s'){S=m.s;sel=mode=atk=null;pay=[];$('lobby').hidden=true;$('game').hidden=false;document.body.classList.add('ing');render()}}}
const send=m=>ws&&ws.readyState==1&&ws.send(JSON.stringify(m));
function go(){if(!rm.value)return alert('ใส่รหัสห้อง');music();wake();send({t:'join',room:rm.value})}
function auth(t){send({t,name:an.value,pw:ap.value})}
function me(m){ME=m;$('top').innerHTML=`💎 <b>${m.gems}</b> · ${esc(m.name)} <button onclick="shop()">ร้านค้า</button><button onclick="decks()">เด็ค</button><button onclick="frs()">เพื่อน${m.rq.length?' ('+m.rq.length+')':''}</button><button onclick="st()">⚙</button><button onclick="cfg.tok='';ap();location.reload()">ออก</button><br><small>การันตี UR+ ในอีก ${Math.max(1,20-m.pity)} ซอง</small>`;$('sv').innerHTML=Object.keys(m.decks).map(n=>`<button data-d="${esc(n)}" onclick="send({t:'deck',mine:this.dataset.d})">${esc(n)}</button>`).join('')}
let bd;const oc=i=>Object.entries(ME.cards).reduce((a,[k,v])=>k.split('|')[0]==i?a+v:a,0),exp=o=>Object.entries(o).flatMap(([i,n])=>Array(n).fill(i)),sm=o=>Object.values(o).reduce((a,b)=>a+b,0);
function decks(){bd=bd||{n:'',m:{},l:{},q:'',t:''};bdr();md.hidden=false}
function bdc(i,d){const o=C[i].t=='Life'?bd.l:bd.m,n=(o[i]||0)+d;if(n<0||n>oc(i)||n>(C[i].lim||4))return;n?o[i]=n:delete o[i];bdr()}
function ldd(n){const k=ME.decks[n];if(!k)return;bd={n,m:{},l:{},q:'',t:''};k.main.forEach(i=>bd.m[i]=(bd.m[i]||0)+1);k.life.forEach(i=>bd.l[i]=(bd.l[i]||0)+1);bdr()}
function bdr(){const own={};Object.keys(ME.cards).forEach(k=>own[k.split('|')[0]]=1);const q=bd.q.toLowerCase(),cn=c=>(c.t=='Life'?bd.l:bd.m)[c.id]||0,
L=Object.keys(own).map(i=>C[i]).filter(c=>c&&(!bd.t||c.t==bd.t)&&(!q||c.n.toLowerCase().includes(q)||c.id.toLowerCase().includes(q))).slice(0,60),
row=(c,n)=>`<div class="rw"><a onclick="zoom('${c.id}',0)">${esc(c.n)}</a><small>${c.id} ${c.t} ${c.c??''}${c.g?'◆'+c.g:''}</small><b>${n}</b><button onclick="bdc('${c.id}',-1)">−</button><button onclick="bdc('${c.id}',1)">+</button></div>`;
$('md').innerHTML=`<div class="in"><button onclick="md.hidden=true">ปิด</button> Main ${sm(bd.m)}/50 · LIFE ${sm(bd.l)}/5<br><input style="width:50%" value="${esc(bd.n)}" placeholder="ชื่อเด็ค" onchange="bd.n=this.value"><button onclick="send({t:'savedeck',name:bd.n,main:exp(bd.m),life:exp(bd.l),draft:1})">บันทึก</button><select onchange="ldd(this.value)"><option value="">โหลดเด็ค…</option>${Object.keys(ME.decks).map(n=>`<option>${esc(n)}</option>`).join('')}</select><br><input style="width:50%" placeholder="ค้นหาชื่อ/รหัส" value="${esc(bd.q)}" onchange="bd.q=this.value;bdr()"><select onchange="bd.t=this.value;bdr()">${['','Avatar','Magic','Construct','Life'].map(t=>`<option value="${t}" ${bd.t==t?'selected':''}>${t||'ทุกประเภท'}</option>`).join('')}</select>
<div style="display:flex;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:260px"><b>การ์ดที่มี</b>${L.map(c=>row(c,oc(c.id)+' / '+cn(c))).join('')}</div><div style="flex:1;min-width:260px"><b>เด็ค</b>${[...Object.keys(bd.m),...Object.keys(bd.l)].filter(i=>C[i]&&cn(C[i])).map(i=>row(C[i],cn(C[i]))).join('')}</div></div></div>`}
function frs(){$('md').innerHTML=`<div class="in"><button onclick="md.hidden=true">ปิด</button><h3>เพื่อน</h3><input id="fn" placeholder="ชื่อผู้ใช้เพื่อน"><button onclick="send({t:'fadd',name:fn.value})">เพิ่ม</button><h4>รายชื่อ</h4>${ME.fr.map(esc).join('<br>')||'-'}${ME.rq.length?'<h4>คำขอ</h4>'+ME.rq.map(n=>`<div>${esc(n)} <button data-n="${esc(n)}" onclick="send({t:'facc',name:this.dataset.n,ok:1})">รับ</button><button data-n="${esc(n)}" onclick="send({t:'facc',name:this.dataset.n,ok:0})">ปฏิเสธ</button></div>`).join(''):''}</div>`;$('md').hidden=false}
function shop(){const S_=['BT01','BT02','BT03','BT04','BT05','BT06','BT07','BT08','BT09','BT10','BT11'];$('md').innerHTML=`<div class="in"><button onclick="md.hidden=true">ปิด</button> 💎 ${ME.gems}<h3>Box Set</h3>${S_.map(s=>`<div>${s} <button onclick="send({t:'open',set:'${s}',n:1})">1 ซอง 100💎</button><button onclick="send({t:'open',set:'${s}',n:10})">10 ซอง 900💎</button></div>`).join('')}<h3>Starter Deck (1500💎)</h3>${Object.entries(ST).filter(([k])=>!/^SD0[123]$/.test(k)).map(([k,v])=>`<div>${k} ${esc(v.name)} <button onclick="send({t:'buyst',set:'${k}'})">ซื้อ</button></div>`).join('')}<small>KD02–04 เร็วๆ นี้ (รอข้อมูลจำนวนใบ)</small><h3>Redeem Code</h3><input id="cd" placeholder="โค้ด"><button onclick="send({t:'code',c:cd.value})">ใช้โค้ด</button></div>`;$('md').hidden=false}
function packs(ps){md.hidden=true;let i=0;const D=[['-40vw','-40vh'],['40vw','-40vh'],['-45vw','0'],['45vw','0'],['0','50vh']];const nx=()=>{if(i>=ps.length){$('zm').hidden=true;$('zm').onclick=()=>$('zm').hidden=true;return}const p=ps[i++];$('zm').hidden=false;$('zm').innerHTML=`<div style="width:100%;height:100%;position:relative;text-align:center"><div style="padding:8px">ซอง ${i}/${ps.length} · แตะเพื่อไปต่อ</div>${p.map((x,k)=>{const c=C[x.id]||{n:x.id};return`<div class="c pk r${x.r}" style="position:absolute;left:${6+k*18}%;top:40%;--dx:${D[k][0]};--dy:${D[k][1]};animation-delay:${k*.4}s;--k:${KC[c.col]||'#999'}"><b>${esc(c.n)}</b><i>${x.r}</i></div>`}).join('')}</div>`};$('zm').onclick=nx;nx()}
const find=u=>{for(const w of['me','op'])for(const z of['hand','av','mg','co','hell','life'])for(const x of S[w][z]||[])if(x.u===u)return{x,z,o:w=='op'}};
const can=(x,z,o)=>(mode=='atk'&&z=='av'&&o)||(mode=='tgt'&&z=='av')||(mode=='pay'&&z=='hand'&&x.u!=sel);
const cd=(x,z,o)=>{const c=info(x),p=c.p!=null?c.p+(x.pw||0):'';return`<div class="c${x.tired?' z':''}${sel==x.u?' sel':''}${pay.includes(x.u)?' pay':''}${can(x,z,o)?' can':''}" data-u="${x.u}" data-z="${z}" data-o="${o?1:0}" style="--k:${KC[c.col]||'#999'}"><b>${esc(c.n)}</b><i>${c.t=='Magic'?'':c.c??''}${c.g?'◆'+c.g:''}</i>${p!==''?`<s class="p ${x.pw>0?'up':x.pw<0?'dn':''}" data-k="${x.u}">${p}</s>`:''}${(x.gear||[]).length?'<em>+'+x.gear.length+'</em>':''}</div>`};
const row=(a,z,o)=>`<div class="r">${a.map(x=>cd(x,z,o)).join('')}</div>`;
const life=(p,o)=>`<div class="r">${p.life.map(l=>l.up?cd(l,'life',o):'<div class="c bk"></div>').join('')}</div>`;
const pi=(p,o)=>`<div class="pi">${esc(p.name)} · เด็ค ${p.deck} · มือ ${p.hn??p.hand.length} · <a data-h="${o?1:0}">นรก ${p.hell.length}</a></div>`;
function render(){const m=S.me,o=S.op;
$('mid').innerHTML=pi(o,1)+life(o,1)+row(o.co,'co',1)+row(o.av,'av',1)+`<div class="ph">${S.mine?'เทิร์นเรา':'เทิร์นศัตรู'} · ${PH[S.phase]}${S.land?' · Land: '+esc(info(S.land.c).n):''}</div>`+row(m.av,'av',0)+row(m.co,'co',0)+row(m.mg,'mg',0)+life(m,0)+pi(m,0);
$('hand').innerHTML=m.hand.map(x=>cd(x,'hand',0)).join('');
const L=S.log.slice(-10).map(esc);$('lg').innerHTML=L.join('<hr>');$('ls').innerHTML=L.slice(-2).join('<br>')+(S.over?'<br><b>'+esc(S.over)+'</b>':'');
document.querySelectorAll('.p').forEach(s=>{const u=s.dataset.k,v=+s.textContent;if(prev[u]!==undefined&&prev[u]!==v)s.classList.add('pop');prev[u]=v});
if(S.mine&&lastMine===false)sfx('turn');lastMine=S.mine;
if(S.log.length>lastLog&&/LIFE หงาย|สู้|ตาย/.test(S.log.slice(lastLog).join()))sfx('hit');lastLog=S.log.length;
if(S.ev&&S.ev.n!=lastEv){lastEv=S.ev.n;zoom(S.ev.id,2400);sfx('play')}
detail();bar()}
function detail(){const f=sel&&find(sel);$('dt').innerHTML=f?bigHtml(info(f.x)):'แตะการ์ดเพื่ออ่านเอฟเฟกต์'}
const bigHtml=c=>`<b>${esc(c.n)}</b><br>${c.t||''} ${c.st||''} ${c.s||''}<br>${c.t=='Magic'?'':'Cost '+(c.c??'-')+' '}${c.g?'Gem '+c.g+' ':''}${c.p!=null?'Power '+c.p:''}<hr>${esc(c.e||'')}`;
function zoom(id,ms){const c=C[id];if(!c)return;$('zm').innerHTML=`<div class="big">${bigHtml(c)}</div>`;$('zm').hidden=false;clearTimeout(zoom.t);if(ms)zoom.t=setTimeout(()=>$('zm').hidden=true,ms)}
$('zm').onclick=()=>$('zm').hidden=true;
$('hand').addEventListener('pointermove',e=>{const cs=[...$('hand').children],r=$('hand').getBoundingClientRect(),i=Math.min(cs.length-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*cs.length)));cs.forEach((c,k)=>c.classList.toggle('h',k==i))});
$('hand').addEventListener('pointerleave',()=>[...$('hand').children].forEach(c=>c.classList.remove('h')));
document.addEventListener('click',e=>{const h=e.target.closest('[data-h]');if(h&&S)return hell(+h.dataset.h);
const c=e.target.closest('.c[data-u]');if(!c||!S)return;const u=+c.dataset.u,z=c.dataset.z,o=c.dataset.o=='1';
if(c.closest('#md')){const f=find(u);return f&&zoom(f.x.id,0)}
if(S.phase=='mull'){pay.includes(u)?pay.splice(pay.indexOf(u),1):pay.push(u);return render()}
if(mode=='pay'&&z=='hand'){pay.includes(u)?pay.splice(pay.indexOf(u),1):pay.push(u);return render()}
if(mode=='tgt'&&z=='av')return send({t:'cast',u:sel,tg:u});
if(mode=='atk'&&o&&z=='av')return send({t:'atk',u:atk,tg:u});
if(z=='life'){return zoom(find(u).x.id,0)}
sel=u;mode=null;render()});
function hell(w){const p=w?S.op:S.me;$('md').innerHTML=`<div class="in"><button onclick="md.hidden=true">ปิด</button> นรก (${p.hell.length}) แตะการ์ดเพื่ออ่าน<div class="r">${p.hell.map(x=>cd(x,'hell',w)).join('')}</div></div>`;$('md').hidden=false}
function st(){const s=(k,t,v)=>`<label>${t} <select onchange="cfg.${k}=isNaN(this.value)?this.value:+this.value;ap();music()">${Object.entries(v).map(([a,b])=>`<option value="${a}" ${cfg[k]==a?'selected':''}>${b}</option>`).join('')}</select></label><br>`;
$('md').innerHTML=`<div class="in"><button onclick="md.hidden=true">ปิด</button><br>${s('th','ธีม',{dark:'มืด',light:'สว่าง'})}${s('bg','พื้นหลังล็อบบี้',{pasulol:'ผู้รู้ความจริง',neon:'นีออน',stars:'ดวงดาว'})}<label>วิดีโอพื้นหลัง (ชื่อไฟล์ เช่น bg1.mp4) <input value="${esc(cfg.bgv)}" onchange="cfg.bgv=this.value;ap()"></label><br>${s('cs','ลายการ์ด',{crayon:'กรอบสีเทียน',plain:'เรียบ'})}${s('snd','เสียงเอฟเฟกต์',{1:'เปิด',0:'ปิด'})}${s('mus','เพลงพื้นหลัง',{1:'เปิด',0:'ปิด'})}${s('wl','กันจอดับ',{1:'เปิด',0:'ปิด'})}${s('fs','ขนาดตัวอักษร',{14:'เล็ก',16:'กลาง',19:'ใหญ่'})}</div>`;$('md').hidden=false}
function bar(){const b=$('bar');b.innerHTML='';const A=(t,f)=>{const e=document.createElement('button');e.textContent=t;e.onclick=f;b.append(e)};
if(S.over)return A('กลับหน้าหลัก',()=>location.reload());
if(S.phase=='mull'){A('เปลี่ยนที่เลือก ('+pay.length+')',()=>send({t:'mull',us:pay}));return A('เก็บทั้งหมด',()=>send({t:'mull',us:[]}))}
const f=sel&&find(sel),c=f&&info(f.x);
if(mode=='pay')A('ยืนยันจ่าย ('+pay.length+')',()=>send({t:c.t=='Avatar'?'summon':'build',u:sel,pay}));
if(mode=='atk')A('ตี LIFE',()=>send({t:'atk',u:atk,tg:'life'}));
if(mode){return A('ยกเลิก',()=>{mode=null;pay=[];render()})}
if(f&&!f.o){if(f.z=='hand'){if(c.t=='Avatar'||c.t=='Construct')A(c.t=='Avatar'?'อัญเชิญ':'ก่อสร้าง',()=>c.c?(mode='pay',pay=[],render()):send({t:c.t=='Avatar'?'summon':'build',u:sel,pay:[]}));
if(c.t=='Magic')A('ร่าย',()=>c.st=='Modification'?(mode='tgt',render()):send({t:'cast',u:sel}));A('ทิ้ง',()=>send({t:'discard',u:sel}))}
else{if(f.z=='av'&&S.phase=='battle'&&S.mine)A('โจมตี',()=>{atk=sel;mode='atk';render()});
if(f.z=='av'){A('นอน/ตื่น',()=>send({t:'tire',u:sel}));A('+1',()=>send({t:'pw',u:sel,d:1}));A('-1',()=>send({t:'pw',u:sel,d:-1}))}
A('→นรก',()=>send({t:'move',u:sel,to:'hell'}));A('→มือ',()=>send({t:'move',u:sel,to:'hand'}))}}
if(S.mine)A(S.phase=='main'?'→ Battle':S.phase=='battle'?'→ End':'จบเทิร์น',()=>send({t:'next'}));
A('+Token',()=>{const n=prompt('ชื่อ Token'),p=prompt('Power');n&&send({t:'token',n,p})});A('จั่ว',()=>send({t:'drawn'}));A('⚙',st)}
conn();
</script>
