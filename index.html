if(a=='ii'){const v=prompt('ค่าอินนิเชียทีฟ (เว้นว่าง = ลบ)',t.i??'');if(v!==null)t.i=v===''?null:+v}
if(a=='dp'){const c={...t,id:uid(),x:t.x+s.g,y:t.y+s.g};s.tk.push(c);sel=c.id}
if(a=='dl'){s.tk=s.tk.filter(k=>k!=t);sel=null}
insp();draw();save();if(tab==2)pane()};
function add(o){const s=sc(),r=cv.getBoundingClientRect(),n=s.tk.length,t=Object.assign({id:uid(),x:(r.width/2-V.x)/V.z+((n%5)-2)*s.g,y:(r.height/2-V.y)/V.z,s:1},o);snap(t);s.tk.push(t);sel=t.id;insp();draw();save()}
const ord=()=>sc().tk.filter(t=>t.i!=null).sort((a,b)=>b.i-a.i);
const lib=()=>`<div class="chips">${[...Object.entries(LIB).map(([k,v])=>[k,v[0]]),['my','ของฉัน']].map(([k,n])=>`<button data-c="${k}" class="${k==cat?'on':''}">${n}</button>`).join('')}</div><div class="grid">${(cat=='my'?S.lib.map((t,i)=>`<button data-u="${i}"><img src="${t.img}"><span>${esc(t.n)}</span></button>`):LIB[cat][1].map((t,i)=>`<button data-i="${i}"><b>${t[0]}</b><span>${t[1]}</span></button>`)).join('')}</div>${cat=='my'?'<label class="btn">＋ อัปโหลดโทเคน (รูปใดก็ได้)<input type="file" accept="image/*" id="qut" hidden></label>':''}<p class="mut">แตะเพื่อวางโทเคนกลางจอ แตะโทเคนบนแผนที่เพื่อเลือก แล้วค่อยลาก</p>`;
const scn=()=>{const s=sc();return`<label>ชื่อฉาก<input id="qsn" value="${esc(s.n)}"></label><label><input type="checkbox" id="qsf" ${s.fog?'checked':''}> โหมดหมอก (ผู้เล่นเห็นเฉพาะส่วนที่เปิด)</label><div class="row"><button id="qfa">เปิดหมอกทั้งหมด</button><button id="qfb">คลุมหมอกทั้งหมด</button></div><label>ขนาดพู่กันหมอก<input type="range" id="qbr" min="30" max="300" value="${brush}"></label><label><input type="checkbox" id="qsg" ${s.gr?'checked':''}> แสดงกริด</label><label><input type="checkbox" id="qss" ${s.sn?'checked':''}> โทเคนเกาะช่องกริด</label><label>ขนาดช่อง (พิกเซล)<input type="number" id="qsz" value="${s.g}" min="20" max="200"></label><hr><label>เพิ่มฉากจากแผนที่เริ่มต้น<select id="qps">${Object.keys(P).map(n=>`<option>${n}</option>`).join('')}</select></label><div class="row"><button id="qpa">＋ เพิ่มฉาก</button><label class="btn">🖼️ อัปโหลดแผนที่<input type="file" accept="image/*" id="qum" hidden></label></div><button id="qsd" class="dng">ลบฉากนี้</button>`};
const ini=()=>`<div class="row"><button id="qn">▶ ตาถัดไป</button><button id="qc">ล้างตา</button><button id="qrl">🎲 ทอยอินนิเชียทีฟทุกตัว</button></div><ol>${ord().map(t=>`<li class="${t.id==S.tn?'on':''}">${t.i} — ${esc(t.n)}</li>`).join('')||'<li>เลือกโทเคนแล้วกด "ลำดับ" ในแถบด้านบน</li>'}</ol><hr><b>ลูกเต๋า</b><div class="row"><label class="cf">จำนวนลูก<input type="number" id="qdn" value="${dn}" min="1" max="30"></label><label class="cf">ตัวบวก/ลบ<input type="number" id="qm" value="${md}"></label></div><div class="chips">${[4,6,8,10,12,20,100].map(n=>`<button data-d="${n}">d${n}</button>`).join('')}</div><div class="row"><button data-x="adv">d20 ได้เปรียบ</button><button data-x="dis">d20 เสียเปรียบ</button><button data-x="4d6dl1">4d6 ทิ้งต่ำสุด</button></div><div class="row"><input id="qf" placeholder="สูตร เช่น 2d8+3" value="${esc(fm)}" style="flex:1;min-width:0"><button id="qfr">🎲 ทอย</button></div><div class="mut">${(S.hist||[]).slice(0,10).map(x=>esc(x)).join('<br>')||'ยังไม่มีการทอย'}</div>`;
const dat=()=>`<div class="row"><button id="qx">⬇ ส่งออกไฟล์</button><label class="btn">⬆ นำเข้าไฟล์<input type="file" accept=".json" id="qi" hidden></label></div><button id="qz" class="dng">ล้างข้อมูลทั้งหมด</button><p class="mut">ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ ย้ายเครื่องให้ส่งออกแล้วนำเข้าไฟล์</p>`;
function pane(){$('#pb').innerHTML=[lib,scn,ini,dat][tab]();$('#pt').innerHTML=TN.map((n,i)=>`<button data-t="${i}" class="${i==tab?'on':''}">${n}</button>`).join('')}
function tabs(){$('#tabs').innerHTML=S.scenes.map((s,i)=>`<button data-s="${i}" class="${i==S.cur?'on':''}">${esc(s.n)}</button>`).join('')}
function setPL(v){PL=v;document.body.classList.toggle('pl',v);$('#back').hidden=!v||H;sel=null;insp();fit();pcard()}
function go(i){S.cur=i;sel=null;$('#card').hidden=1;CID=null;tabs();insp();pane();fit();save()}
function rd(f,m,ty,q,sq,cb){const i=new Image();i.onload=()=>{const m2=Math.min(i.width,i.height),k=Math.min(1,m/(sq?m2:Math.max(i.width,i.height))),w=Math.round((sq?m2:i.width)*k),h=Math.round((sq?m2:i.height)*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,sq?(i.width-m2)/2:0,sq?(i.height-m2)/2:0,sq?m2:i.width,sq?m2:i.height,0,0,w,h);cb(c.toDataURL(ty,q),w,h)};i.src=URL.createObjectURL(f)}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.s)};
$('#pt').onclick=e=>{const b=e.target.closest('button');if(b){tab=+b.dataset.t;pane()}};
$('#bp').onclick=()=>$('#panel').classList.toggle('off');
$('#bm').onclick=()=>setPL(1);$('#back').onclick=()=>setPL(0);$('#fit').onclick=fit;
$('#bw').onclick=()=>window.open(location.href.split('#')[0]+'#player','dndp','width=1100,height=700')||alert('เบราว์เซอร์บล็อกหน้าต่างใหม่ ให้เปิดลิงก์เดิมในแท็บใหม่แล้วเติม #player ท้ายลิงก์');
$('#modes').onclick=e=>{const b=e.target.closest('button');if(!b||!b.dataset.m)return;mode=b.dataset.m;[...$('#modes').children].forEach(x=>x.classList.toggle('on',x.dataset.m==mode));if(mode!='move'&&!sc().fog){sc().fog=1;save();draw();if(tab==1)pane()}};
$('#pb').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,s=sc();
if(d.c){cat=d.c;pane()}else if(d.i!=null){const t=LIB[cat][1][d.i];add({e:t[0],n:t[1],c:cat})}else if(d.u!=null){const t=S.lib[d.u];add({img:t.img,n:t.n,c:'my'})}
else if(d.d||d.x||b.id=='qfr'){let f;if(d.d){dn=Math.max(1,Math.min(30,+$('#qdn').value||1));f=dn+'d'+d.d+mf()}else if(d.x=='adv'||d.x=='dis')f='d20'+mf();else if(d.x)f=d.x+mf();else{f=$('#qf').value;fm=f}doRoll(f,d.x=='adv'?1:d.x=='dis'?-1:0)}
else if(b.id=='qn'){const o=ord();if(o.length){S.tn=o[(o.findIndex(t=>t.id==S.tn)+1)%o.length].id;save();draw();pane()}}
else if(b.id=='qc'){S.tn=null;save();draw();pane()}
else if(b.id=='qrl'){s.tk.forEach(t=>{if(t.c=='itm')return;const d20=1+Math.floor(Math.random()*20),m=Math.floor(((t.dex??10)-10)/2);t.i=d20+m});S.tn=null;S.hist=['ทอยอินนิเชียทีฟทุกตัว (d20 + ค่า DEX)',...(S.hist||[])].slice(0,20);save();draw();pane()}
else if(b.id=='qfa'||b.id=='qfb'){const f=fg(s),c=f.getContext('2d');if(b.id=='qfa')c.clearRect(0,0,f.width,f.height);else{c.fillStyle='#000';c.fillRect(0,0,f.width,f.height)}s.fd=f.toDataURL();s.fog=1;save();draw();pane()}
else if(b.id=='qpa'){S.scenes.push(mk($('#qps').value));go(S.scenes.length-1)}
else if(b.id=='qsd'){if(S.scenes.length>1&&confirm('ลบฉากนี้?')){S.scenes.splice(S.cur,1);go(0)}}
else if(b.id=='qx'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='dnd-table.json';a.click()}
else if(b.id=='qz'){if(confirm('ล้างข้อมูลทั้งหมด?')){delete localStorage[Q];load();sel=null;tabs();pane();insp();fit()}}};
$('#pb').oninput=e=>{const s=sc(),i=e.target.id;if(i=='qsn'){s.n=e.target.value;tabs();save()}if(i=='qbr')brush=+e.target.value};
$('#pb').onchange=e=>{const s=sc(),i=e.target.id,f=e.target.files&&e.target.files[0];
if(i=='qsf')s.fog=e.target.checked?1:0;if(i=='qsg')s.gr=e.target.checked?1:0;if(i=='qss')s.sn=e.target.checked?1:0;if(i=='qsz')s.g=Math.max(20,+e.target.value||50);
if(i=='qum'&&f)return rd(f,1600,'image/jpeg',.82,0,(u,w,h)=>{S.scenes.push({...mk('x'),n:f.name.replace(/\.\w+$/,''),m:{t:'i',v:u},W:w,H:h,fog:0});go(S.scenes.length-1)});
if(i=='qut'&&f)return rd(f,160,'image/png',1,1,u=>{S.lib.push({img:u,n:f.name.replace(/\.\w+$/,'')});save();pane()});
if(i=='qi'&&f){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.scenes)throw 0;S=o;FC={};BG={};S.cur=0;sel=null;save();tabs();pane();insp();fit()}catch(x){alert('ไฟล์ไม่ถูกต้อง')}};r.readAsText(f);return}
save();draw()};
function sync(){const k=sc().id;load();if(sc().id!=k||ls!=sc().id){ls=sc().id;fit()}else draw();pcard();news()}
if(BC)BC.onmessage=()=>{if(PL)sync()};addEventListener('storage',e=>{if(PL&&e.key==Q)sync()});
load();ls=sc().id;lro=S.roll&&S.roll.id;lev=S.ev&&S.ev.id;if(innerWidth<760)$('#panel').classList.add('off');
new ResizeObserver(()=>draw()).observe($('#stage'));
tabs();pane();setPL(PL);setTimeout(fit,60);try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
